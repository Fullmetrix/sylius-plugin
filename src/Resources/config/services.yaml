services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            string $apiBase: '%fullmetrix.api_base%'
            string $webhookEndpoint: '%fullmetrix.webhook_endpoint%'
            string $eventsEndpoint: '%fullmetrix.events_endpoint%'
            string $consentEndpoint: '%fullmetrix.consent_endpoint%'
            string $trackerOrigin: '%fullmetrix.tracker_origin%'
            int $connectTimeoutMs: '%fullmetrix.connect_timeout_ms%'
            int $totalTimeoutMs: '%fullmetrix.total_timeout_ms%'
            string $pluginVersion: '1.0.0'

    Fullmetrix\SyliusPlugin\Service\:
        resource: '../../Service/*'
        exclude:
            - '../../Service/CouponCommandHandler.php'

    Fullmetrix\SyliusPlugin\Service\CouponCommandHandler:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $promotionFactory: '@sylius.factory.promotion'
            $couponFactory: '@sylius.factory.promotion_coupon'
            $promotionActionFactory: '@sylius.factory.promotion_action'
            $promotionRuleFactory: '@sylius.factory.promotion_rule'

    Fullmetrix\SyliusPlugin\EventSubscriber\:
        resource: '../../EventSubscriber/*'

    Fullmetrix\SyliusPlugin\Controller\:
        resource: '../../Controller/*'
        exclude:
            - '../../Controller/Shop/CartRecoveryController.php'
        public: true
        tags: ['controller.service_arguments']

    Fullmetrix\SyliusPlugin\Controller\Shop\CartRecoveryController:
        arguments:
            $config: '@Fullmetrix\SyliusPlugin\Service\ConfigStore'
            $cartContext: '@sylius.context.cart'
            $productVariantRepository: '@sylius.repository.product_variant'
            $orderItemFactory: '@sylius.factory.order_item'
            $itemQuantityModifier: '@Sylius\Component\Order\Modifier\OrderItemQuantityModifierInterface'
            $urls: '@router'
        public: true
        tags: ['controller.service_arguments']

    Fullmetrix\SyliusPlugin\Exporter\:
        resource: '../../Exporter/*'

    Fullmetrix\SyliusPlugin\Security\:
        resource: '../../Security/*'
